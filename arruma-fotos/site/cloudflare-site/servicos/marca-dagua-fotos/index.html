<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marca d'Água — PhotoLive Magic</title><meta name="description" content="Adicione uma marca de texto às suas fotos e gere uma nova cópia."><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../photo-tools.css"></head>
<body class="plm-tool-page" data-tool="marca-dagua-fotos">
<header class="plm-top"><div class="plm-brand"><div class="plm-brand-mark">✨</div><div><strong>PhotoLive Magic</strong><span>Marca d'Água</span></div></div><a class="plm-back" href="../../conta/minha-conta.html">← Minha conta</a></header>
<main class="plm-main"><div class="plm-head"><div><span class="plm-eyebrow">PHOTOLIVE MAGIC</span><h1>Marca d'Água</h1><p>Adicione uma marca de texto às suas fotos e gere uma nova cópia.</p></div></div>
<section class="plm-grid"><div class="plm-card"><div class="plm-canvas-wrap"><canvas id="canvas" width="1200" height="800"></canvas></div><div class="plm-actions"><button id="download" class="plm-btn primary">💾 Baixar com marca</button></div></div><div class="plm-card"><h2>Marca d'água</h2><label class="plm-btn primary" style="display:inline-block"><input id="file" class="plm-file" type="file" accept="image/*">📷 Escolher foto</label><div class="plm-field"><label>Texto</label><input id="text" type="text" value="PhotoLive Magic"></div><div class="plm-field"><label>Opacidade <span id="ov">55%</span></label><input id="opacity" type="range" min="10" max="100" value="55"></div><div class="plm-field"><label>Tamanho <span id="sv">44 px</span></label><input id="size" type="range" min="12" max="120" value="44"></div><div class="plm-field"><label>Posição</label><select id="pos"><option value="br">Inferior direita</option><option value="bl">Inferior esquerda</option><option value="tr">Superior direita</option><option value="tl">Superior esquerda</option><option value="c">Centro</option></select></div></div></section></main>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),file=document.getElementById('file'),text=document.getElementById('text'),opacity=document.getElementById('opacity'),size=document.getElementById('size'),pos=document.getElementById('pos');let im=null;file.onchange=e=>{const f=e.target.files[0];if(!f)return;im=new Image();im.onload=()=>{c.width=im.naturalWidth;c.height=im.naturalHeight;draw()};im.src=URL.createObjectURL(f)};[text,opacity,size,pos].forEach(x=>x.oninput=draw);function draw(){ctx.clearRect(0,0,c.width,c.height);if(!im){ctx.fillStyle='#101827';ctx.fillRect(0,0,c.width,c.height);return}ctx.drawImage(im,0,0);const fs=+size.value,pad=Math.max(20,fs/2);ctx.font=`700 ${fs}px system-ui`;const tw=ctx.measureText(text.value||'').width;let x=pad,y=pad+fs;if(pos.value.includes('r'))x=c.width-tw-pad;if(pos.value.includes('b'))y=c.height-pad;else if(pos.value==='c')x=(c.width-tw)/2,y=c.height/2;else if(pos.value==='tl')y=pad+fs;else if(pos.value==='tr')y=pad+fs;else if(pos.value==='bl')y=c.height-pad;ctx.fillStyle=`rgba(255,255,255,${+opacity.value/100})`;ctx.fillText(text.value||'',x,y);ov.textContent=opacity.value+'%';sv.textContent=fs+' px'}document.getElementById('download').onclick=()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='photolive-marca-dagua.png';a.click();URL.revokeObjectURL(a.href)},'image/png');draw();
</script></body></html>
