<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colagem de Fotos — PhotoLive Magic</title><meta name="description" content="Monte duas, três ou quatro fotos em uma nova composição."><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../photo-tools.css"></head>
<body class="plm-tool-page" data-tool="colagem-fotos">
<header class="plm-top"><div class="plm-brand"><div class="plm-brand-mark">✨</div><div><strong>PhotoLive Magic</strong><span>Colagem de Fotos</span></div></div><a class="plm-back" href="../../conta/minha-conta.html">← Minha conta</a></header>
<main class="plm-main"><div class="plm-head"><div><span class="plm-eyebrow">PHOTOLIVE MAGIC</span><h1>Colagem de Fotos</h1><p>Monte duas, três ou quatro fotos em uma nova composição.</p></div></div>
<section class="plm-grid"><div class="plm-card"><div class="plm-canvas-wrap"><canvas id="canvas" width="1200" height="900"></canvas></div><div class="plm-actions"><button id="download" class="plm-btn primary">💾 Baixar colagem</button><button id="clear" class="plm-btn">Limpar</button></div></div><div class="plm-card"><h2>Montagem</h2><label class="plm-btn primary" style="display:inline-block"><input id="files" class="plm-file" type="file" accept="image/*" multiple>📷 Escolher até 4 fotos</label><div class="plm-field"><label>Layout</label><select id="layout"><option value="2x2">2 × 2</option><option value="1x2">1 × 2</option><option value="2x1">2 × 1</option><option value="1x3">1 × 3</option></select></div><div class="plm-field"><label>Espaço <span id="sv">16 px</span></label><input id="space" type="range" min="0" max="60" value="16"></div><p class="plm-muted">A ferramenta cria uma nova imagem a partir das fotos escolhidas.</p></div></section></main>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),files=document.getElementById('files'),layout=document.getElementById('layout'),space=document.getElementById('space'),sv=document.getElementById('sv');let imgs=[];files.onchange=e=>{imgs=[];[...e.target.files].slice(0,4).forEach(f=>{const im=new Image();im.onload=()=>{imgs.push(im);draw()};im.src=URL.createObjectURL(f)})};[layout,space].forEach(x=>x.oninput=draw);function fit(im,x,y,w,h){const r=Math.max(w/im.width,h/im.height),dw=im.width*r,dh=im.height*r;ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}function draw(){const s=+space.value;sv.textContent=s+' px';ctx.fillStyle='#111827';ctx.fillRect(0,0,c.width,c.height);if(!imgs.length)return;let cols=2,rows=2;if(layout.value==='1x2'){cols=1;rows=2}if(layout.value==='2x1'){cols=2;rows=1}if(layout.value==='1x3'){cols=1;rows=3}const cw=(c.width-s*(cols+1))/cols,ch=(c.height-s*(rows+1))/rows;imgs.slice(0,cols*rows).forEach((im,i)=>{const col=i%cols,row=Math.floor(i/cols);fit(im,s+col*(cw+s),s+row*(ch+s),cw,ch)})}document.getElementById('clear').onclick=()=>{imgs=[];draw()};document.getElementById('download').onclick=()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='photolive-colagem.jpg';a.click();URL.revokeObjectURL(a.href)},'image/jpeg',.92);draw();
</script></body></html>
