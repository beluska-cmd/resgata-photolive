<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redimensionador de Fotos — PhotoLive Magic</title><meta name="description" content="Ajuste tamanho e proporção das imagens para redes sociais, documentos e sites."><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../photo-tools.css"></head>
<body class="plm-tool-page" data-tool="redimensionar-fotos">
<header class="plm-top"><div class="plm-brand"><div class="plm-brand-mark">✨</div><div><strong>PhotoLive Magic</strong><span>Redimensionador de Fotos</span></div></div><a class="plm-back" href="../../conta/minha-conta.html">← Minha conta</a></header>
<main class="plm-main"><div class="plm-head"><div><span class="plm-eyebrow">PHOTOLIVE MAGIC</span><h1>Redimensionador de Fotos</h1><p>Ajuste tamanho e proporção das imagens para redes sociais, documentos e sites.</p></div></div>
<section class="plm-grid"><div class="plm-card"><div id="drop" class="plm-drop">📐 Escolha imagens para redimensionar<input id="files" class="plm-file" type="file" accept="image/*" multiple></div><div id="list" class="plm-list"></div></div><div class="plm-card"><h2>Tamanho</h2><div class="plm-field"><label>Largura (px)</label><input id="width" type="number" min="1" value="1200"></div><div class="plm-field"><label>Altura (px)</label><input id="height" type="number" min="1" value="800"></div><label class="plm-check"><input id="keep" type="checkbox" checked> Manter proporção</label><div class="plm-field"><label>Formato</label><select id="format"><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select></div></div></section></main>
<script>
const input=document.getElementById('files'),drop=document.getElementById('drop'),list=document.getElementById('list'),wi=document.getElementById('width'),he=document.getElementById('height'),keep=document.getElementById('keep'),fmt=document.getElementById('format');drop.onclick=()=>input.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');add([...e.dataTransfer.files])};input.onchange=e=>add([...e.target.files]);wi.oninput=()=>{if(keep.checked)he.value=Math.round(+wi.value*800/1200)};function add(files){list.innerHTML='';files.filter(f=>f.type.startsWith('image/')).forEach(f=>{const row=document.createElement('div');row.className='plm-item';row.innerHTML=`<div><strong>${esc(f.name)}</strong><br><small>${(f.size/1024).toFixed(1)} KB</small></div><button class="plm-btn primary">Redimensionar</button>`;list.appendChild(row);row.querySelector('button').onclick=()=>go(f)})}function go(f){const im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{let w=+wi.value,h=+he.value;if(keep.checked){const r=Math.min(w/im.naturalWidth,h/im.naturalHeight);w=Math.max(1,Math.round(im.naturalWidth*r));h=Math.max(1,Math.round(im.naturalHeight*r))}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>{const ext=fmt.value.split('/')[1].replace('jpeg','jpg');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name.replace(/\.[^.]+$/,'')+'-'+w+'x'+h+'.'+ext;a.click();URL.revokeObjectURL(a.href)},fmt.value,.9);URL.revokeObjectURL(url)};im.src=url}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
