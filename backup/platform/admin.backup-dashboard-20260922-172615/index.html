<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resgata+ Admin</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">+</div>
      <div>
        <strong>RESGATA+</strong>
        <span>ADMIN</span>
      </div>
    </div>

    <nav>
      <button class="nav-item active" data-page="dashboard">🏠 <span>Dashboard</span></button>
      <button class="nav-item" data-page="users">👤 <span>Usuários</span></button>
      <button class="nav-item" data-page="devices">📱 <span>Dispositivos</span></button>
      <button class="nav-item" data-page="services">🧩 <span>Serviços</span></button>
      <button class="nav-item" data-page="requests">📋 <span>Solicitações</span></button>
      <button class="nav-item" data-page="tickets">🎧 <span>Atendimento</span></button>
      <button class="nav-item" data-page="updates">🔄 <span>Atualizações</span></button>
      <button class="nav-item" data-page="plans">💳 <span>Planos</span></button>
      <button class="nav-item" data-page="security">🛡️ <span>Segurança</span></button>
      <button class="nav-item" data-page="reports">📊 <span>Relatórios</span></button>
      <button class="nav-item" data-page="logs">📝 <span>Logs</span></button>
      <button class="nav-item" data-page="settings">⚙️ <span>Configurações</span></button>
    </nav>

    <div class="sidebar-bottom">
      <div class="admin-mini">
        <div class="avatar">A</div>
        <div>
          <strong id="adminName">Administrador</strong>
          <small id="adminRole">superadmin</small>
        </div>
      </div>
      <button id="logoutButton" class="logout">↪ Sair</button>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div>
        <div class="mobile-brand">RESGATA+</div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Visão geral da Central Resgata+</p>
      </div>

      <div class="top-actions">
        <span class="status-dot"></span>
        <span>Central online</span>
        <button id="refreshButton" class="icon-button" title="Atualizar">↻</button>
      </div>
    </header>

    <section id="content" class="content"></section>

  </main>
</div>

<div id="toast" class="toast"></div>

<script src="/admin/app.js"></script>
</body>
</html>
