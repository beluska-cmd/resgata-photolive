<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets — Resgata+</title>
  <link rel="stylesheet" href="/admin/style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .tickets-page {
      min-height: 100vh;
      padding: 28px;
    }

    .tickets-container {
      width: min(1240px, 100%);
      margin: 0 auto;
    }

    .tickets-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand {
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .05em;
      opacity: .6;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 4vw, 36px);
    }

    .description {
      margin: 9px 0 0;
      color: #647086;
      line-height: 1.55;
    }

    .back {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid #dfe4ec;
      border-radius: 10px;
      background: #fff;
      color: #172033;
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .summary-card {
      padding: 18px;
      border: 1px solid #e2e6ed;
      border-radius: 14px;
      background: #fff;
    }

    .summary-label {
      display: block;
      color: #68748a;
      font-size: 13px;
      font-weight: 700;
    }

    .summary-value {
      display: block;
      margin-top: 7px;
      font-size: 27px;
      font-weight: 800;
    }

    .panel {
      border: 1px solid #e2e6ed;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 4px 18px rgba(23,32,51,.04);
      overflow: hidden;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px 180px auto;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #e7eaf0;
      background: #fafbfc;
    }

    .filters input,
    .filters select,
    .filters button {
      min-height: 43px;
      border: 1px solid #dce1e9;
      border-radius: 9px;
      background: #fff;
      color: #172033;
      font: inherit;
    }

    .filters input,
    .filters select {
      padding: 0 12px;
      outline: none;
    }

    .filters button {
      padding: 0 15px;
      cursor: pointer;
      font-weight: 800;
    }

    .tickets-list {
      padding: 14px;
    }

    .ticket-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px;
      margin-bottom: 10px;
      border: 1px solid #e4e8ee;
      border-radius: 13px;
      background: #fff;
    }

    .ticket-row:last-child {
      margin-bottom: 0;
    }

    .ticket-main {
      min-width: 0;
      flex: 1;
    }

    .ticket-title-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .ticket-title-line h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.4;
    }

    .ticket-message {
      margin: 7px 0 10px;
      color: #667287;
      font-size: 14px;
      line-height: 1.5;
    }

    .ticket-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      color: #788397;
      font-size: 12px;
    }

    .ticket-status,
    .ticket-priority {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-open { background: #eef5ff; }
    .status-in_progress,
    .status-waiting_specialist { background: #fff5df; }
    .status-waiting_user { background: #f1efff; }
    .status-resolved,
    .status-closed { background: #edf8f1; }
    .status-cancelled { background: #f8eeee; }

    .priority-low,
    .priority-normal { background: #eef2f7; }
    .priority-high { background: #fff1df; }
    .priority-urgent { background: #f9e8e8; }

    .ticket-actions {
      flex: 0 0 auto;
    }

    .ticket-open-button {
      min-height: 40px;
      padding: 0 15px;
      border: 1px solid #d6dce5;
      border-radius: 9px;
      background: #fff;
      color: #172033;
      cursor: pointer;
      font-weight: 800;
    }

    .tickets-state {
      min-height: 230px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      text-align: center;
      color: #69758a;
    }

    .tickets-state-icon {
      font-size: 32px;
    }

    .tickets-state-error {
      color: #8a3e3e;
    }

    @media (max-width: 900px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 650px) {
      .tickets-page {
        padding: 18px 13px;
      }

      .tickets-header {
        flex-direction: column;
      }

      .back {
        width: 100%;
        justify-content: center;
      }

      .summary-grid {
        grid-template-columns: 1fr 1fr;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .ticket-row {
        flex-direction: column;
        align-items: stretch;
      }

      .ticket-open-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="tickets-page">
    <div class="tickets-container">

      <header class="tickets-header">
        <div>
          <div class="brand">RESGATA+</div>
          <h1>🎫 Tickets</h1>
          <p class="description">
            Central de tickets do atendimento. Dados reais do sistema.
          </p>
        </div>

        <a class="back" href="/admin/atendimento/">
          ← Voltar ao Atendimento
        </a>
      </header>

      <section class="summary-grid" aria-label="Resumo dos tickets">

        <div class="summary-card">
          <span class="summary-label">Total</span>
          <strong id="summary-total" class="summary-value">—</strong>
        </div>

        <div class="summary-card">
          <span class="summary-label">Abertos</span>
          <strong id="summary-open" class="summary-value">—</strong>
        </div>

        <div class="summary-card">
          <span class="summary-label">Em atendimento</span>
          <strong id="summary-progress" class="summary-value">—</strong>
        </div>

        <div class="summary-card">
          <span class="summary-label">Finalizados</span>
          <strong id="summary-closed" class="summary-value">—</strong>
        </div>

      </section>

      <section class="panel">

        <div class="filters">

          <input
            id="ticket-search"
            type="search"
            placeholder="Buscar ticket, cliente ou e-mail..."
            autocomplete="off"
          >

          <select id="ticket-status">
            <option value="">Todos os status</option>
            <option value="open">Abertos</option>
            <option value="in_progress">Em atendimento</option>
            <option value="waiting_user">Aguardando cliente</option>
            <option value="waiting_specialist">Aguardando especialista</option>
            <option value="resolved">Resolvidos</option>
            <option value="closed">Fechados</option>
            <option value="cancelled">Cancelados</option>
          </select>

          <select id="ticket-priority">
            <option value="">Todas as prioridades</option>
            <option value="low">Baixa</option>
            <option value="normal">Normal</option>
            <option value="high">Alta</option>
            <option value="urgent">Urgente</option>
          </select>

          <button id="ticket-refresh" type="button">
            ↻ Atualizar
          </button>

        </div>

        <div
          id="tickets-list"
          class="tickets-list"
          aria-live="polite"
        ></div>

      </section>

    </div>
  </main>

  <script src="/admin/atendimento/tickets/tickets-page.js"></script>
</body>
</html>
