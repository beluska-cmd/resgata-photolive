<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat de Atendimento — Resgata+</title>

  <link rel="stylesheet" href="/admin/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .chat-page {
      min-height: 100vh;
      padding: 28px;
    }

    .chat-container {
      width: min(1280px, 100%);
      margin: 0 auto;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }

    .brand {
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .05em;
      opacity: .6;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 4vw, 36px);
    }

    .description {
      margin: 8px 0 0;
      color: #667287;
      line-height: 1.5;
    }

    .back {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid #dfe4ec;
      border-radius: 10px;
      background: #fff;
      color: #172033;
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }

    .chat-content {
      min-height: 650px;
    }

    .chat-layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 16px;
    }

    .chat-sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-sidebar-card,
    .chat-main {
      border: 1px solid #e1e6ed;
      border-radius: 15px;
      background: #fff;
    }

    .chat-sidebar-card {
      padding: 18px;
    }

    .chat-sidebar-card strong {
      display: block;
      margin-top: 6px;
      font-size: 16px;
    }

    .chat-sidebar-card small {
      display: block;
      margin-top: 5px;
      color: #758196;
      overflow-wrap: anywhere;
    }

    .chat-label {
      display: block;
      color: #7a8598;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .chat-info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      color: #68748a;
      font-size: 13px;
    }

    .chat-info-row strong {
      margin: 0;
      color: #172033;
      font-size: 13px;
    }

    .chat-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 650px;
    }

    .chat-main-header {
      padding: 19px 20px;
      border-bottom: 1px solid #e7eaf0;
    }

    .chat-main-header h2 {
      margin: 5px 0 3px;
      font-size: 19px;
    }

    .chat-main-header small {
      color: #8a94a6;
    }

    .chat-request {
      margin: 14px 16px 0;
      padding: 14px 16px;
      border: 1px solid #e5e9ef;
      border-radius: 11px;
      background: #fafbfc;
    }

    .chat-request p {
      margin: 7px 0 0;
      color: #536075;
      line-height: 1.5;
    }

    .chat-messages {
      flex: 1;
      min-height: 350px;
      max-height: 58vh;
      overflow-y: auto;
      padding: 18px 16px;
    }

    .chat-message {
      width: fit-content;
      max-width: 78%;
      margin-bottom: 12px;
      padding: 11px 13px;
      border: 1px solid #e2e6ec;
      border-radius: 13px;
      background: #fff;
    }

    .chat-message.client {
      margin-right: auto;
    }

    .chat-message.admin,
    .chat-message.specialist {
      margin-left: auto;
    }

    .chat-message.internal {
      margin-left: auto;
      background: #fff9eb;
      border-color: #ead8a8;
    }

    .chat-message.system {
      margin-left: auto;
      margin-right: auto;
    }

    .chat-message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      color: #68748a;
      font-size: 11px;
    }

    .chat-message-header time {
      color: #9aa3b1;
    }

    .chat-message-body {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      font-size: 14px;
    }

    .internal-badge {
      padding: 2px 6px;
      border-radius: 999px;
      background: #f0dfaa;
      color: #6d581f;
      font-weight: 800;
    }

    .chat-composer {
      border-top: 1px solid #e7eaf0;
      padding: 14px 16px;
      background: #fafbfc;
    }

    #chat-input {
      display: block;
      width: 100%;
      resize: vertical;
      min-height: 82px;
      padding: 12px;
      border: 1px solid #d9dfe8;
      border-radius: 10px;
      background: #fff;
      color: #172033;
      font: inherit;
      outline: none;
    }

    #chat-input:focus {
      border-color: #8d98aa;
    }

    .chat-composer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .chat-internal {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #6d7789;
      font-size: 13px;
      font-weight: 700;
    }

    #chat-send {
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid #cfd6e1;
      border-radius: 9px;
      background: #172033;
      color: #fff;
      cursor: pointer;
      font-weight: 800;
    }

    #chat-send:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .chat-state {
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #69758a;
      text-align: center;
    }

    .chat-state-icon {
      font-size: 34px;
    }

    .chat-state-error {
      color: #8a3e3e;
    }

    .chat-empty {
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #738096;
      text-align: center;
    }

    .chat-empty span {
      font-size: 30px;
    }

    .chat-empty small {
      max-width: 340px;
      line-height: 1.5;
    }

    @media (max-width: 850px) {
      .chat-page {
        padding: 18px 13px;
      }

      .chat-header {
        flex-direction: column;
      }

      .back {
        width: 100%;
        justify-content: center;
      }

      .chat-layout {
        grid-template-columns: 1fr;
      }

      .chat-sidebar {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .chat-main {
        min-height: 600px;
      }
    }

    @media (max-width: 560px) {
      .chat-sidebar {
        grid-template-columns: 1fr;
      }

      .chat-message {
        max-width: 90%;
      }

      .chat-composer-footer {
        align-items: stretch;
        flex-direction: column;
      }

      #chat-send {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="chat-page">
    <div class="chat-container">

      <header class="chat-header">
        <div>
          <div class="brand">RESGATA+</div>
          <h1>💬 Chat de Atendimento</h1>
          <p class="description">
            Conversa real entre o atendimento e o cliente.
          </p>
        </div>

        <a
          class="back"
          href="/admin/atendimento/tickets/"
        >
          ← Voltar aos Tickets
        </a>
      </header>

      <section
        id="chat-content"
        class="chat-content"
        aria-live="polite"
      >
        <div class="chat-state">
          <div class="chat-state-icon">⏳</div>
          <strong>Carregando atendimento...</strong>
        </div>
      </section>

    </div>
  </main>

  <script src="/admin/atendimento/chat/chat-page.js"></script>
</body>
</html>
