<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criador de Fotos — PhotoLive Magic</title><meta name="description" content="Crie posts, capas e stories com foto e texto, diretamente no navegador."><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../photo-tools.css"></head>
<body class="plm-tool-page" data-tool="criador-fotos">
<header class="plm-top"><div class="plm-brand"><div class="plm-brand-mark">✨</div><div><strong>PhotoLive Magic</strong><span>Criador de Fotos</span></div></div><a class="plm-back" href="../../conta/minha-conta.html">← Minha conta</a></header>
<main class="plm-main"><div class="plm-head"><div><span class="plm-eyebrow">PHOTOLIVE MAGIC</span><h1>Criador de Fotos</h1><p>Crie posts, capas e stories com foto e texto, diretamente no navegador.</p></div></div>
<section class="plm-grid"><div class="plm-card"><div class="plm-canvas-wrap"><canvas id="canvas" width="1080" height="1350"></canvas></div><div class="plm-actions"><button id="download" class="plm-btn primary">💾 Baixar criação</button><button id="clear" class="plm-btn">Limpar foto</button></div></div><div class="plm-card"><h2>Compositor</h2><label class="plm-btn primary" style="display:inline-block"><input id="file" class="plm-file" type="file" accept="image/*">📷 Adicionar foto</label><div class="plm-field"><label>Texto</label><input id="text" type="text" value="Minha criação PhotoLive"></div><div class="plm-field"><label>Tamanho do texto <span id="tv">58</span></label><input id="size" type="range" min="20" max="140" value="58"></div><div class="plm-field"><label>Posição vertical <span id="pv">82%</span></label><input id="pos" type="range" min="10" max="95" value="82"></div><div class="plm-field"><label>Formato</label><select id="format"><option value="1080x1350">Post 4:5</option><option value="1080x1080">Quadrado</option><option value="1080x1920">Story 9:16</option><option value="1920x1080">Paisagem 16:9</option></select></div><div class="plm-field"><label class="plm-check"><input id="dark" type="checkbox" checked> Fundo escuro atrás do texto</label></div></section></main>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),file=document.getElementById('file'),text=document.getElementById('text'),size=document.getElementById('size'),pos=document.getElementById('pos'),format=document.getElementById('format'),dark=document.getElementById('dark');let img=null;function resize(){const [w,h]=format.value.split('x').map(Number);c.width=w;c.height=h;draw()}function draw(){ctx.fillStyle='#101827';ctx.fillRect(0,0,c.width,c.height);if(img){const scale=Math.max(c.width/img.width,c.height/img.height);const w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h)}const fs=+size.value;const y=c.height*(+pos.value/100);ctx.font=`800 ${fs}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';if(dark){const m=28;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(m,y-fs*1.05,c.width-m*2,fs*2.1)}ctx.fillStyle='#fff';ctx.fillText(text.value||'',c.width/2,y);document.getElementById('tv').textContent=fs;document.getElementById('pv').textContent=pos.value+'%'}file.onchange=e=>{const f=e.target.files[0];if(!f)return;img=new Image();img.onload=draw;img.src=URL.createObjectURL(f)};[text,size,pos,dark].forEach(x=>x.addEventListener('input',draw));format.onchange=resize;document.getElementById('clear').onclick=()=>{img=null;draw()};document.getElementById('download').onclick=()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='photolive-criacao.png';a.click();URL.revokeObjectURL(a.href)},'image/png');draw();
</script></body></html>
