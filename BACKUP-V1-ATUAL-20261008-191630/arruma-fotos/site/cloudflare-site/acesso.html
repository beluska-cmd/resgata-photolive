html,
body {
  width: 100%;
  min-width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;

  background:
    linear-gradient(
      135deg,
      #061936 0%,
      #0a3158 38%,
      #087b8b 72%,
      #16b8a5 100%

}

/* TELA COMPLETA */
.photolive-access-page {
  width: 100%;
  min-width: 100%;
  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  align-items: center;
  justify-content: center;

  box-sizing: border-box;
  padding: 40px 20px;

  background: transparent;
}

/* CARTÃO CENTRAL */
.photolive-access-card {
  width: min(100%, 560px);
  max-width: 560px;

  box-sizing: border-box;
  padding: 34px 40px;

  background: #ffffff;
  color: #172033;

  border: 0;
  border-radius: 24px;

  box-shadow:
    0 24px 70px rgba(0,0,0,.30);
}

/* CABEÇALHO */
.photolive-access-brand {
  display: block;
  width: 100%;

  text-align: center;
  margin-bottom: 24px;

  color: #172033;
}

.photolive-access-brand-icon {
  display: block;

  font-size: 40px;
  line-height: 1;

  margin-bottom: 8px;
}

.photolive-access-brand h1 {
  display: block;

  margin: 0;

  color: #172033;

  font-size: clamp(25px, 5vw, 34px);
  line-height: 1.15;

  white-space: normal;
}

.photolive-access-brand p {
  display: block;

  margin: 9px 0 0;

  color: #647282;

  font-size: 16px;
  line-height: 1.4;
}

/* ABAS */
.photolive-access-tabs {
  display: grid;

  width: 100%;

  grid-template-columns: 1fr 1fr;
  gap: 8px;

  margin-bottom: 22px;
}

.photolive-access-tab {
  width: 100%;
  min-height: 46px;

  border: 1px solid #d7e0e7;
  border-radius: 11px;

  cursor: pointer;

  font: inherit;
  font-weight: 700;

  background: #edf3f6;
  color: #172033;
}

.photolive-access-tab.active {
  background: #087f8c;
  color: #ffffff;
  border-color: #087f8c;
}

/* FORMULÁRIO */
.photolive-auth-mode {
  width: 100%;
  color: #172033;
}

.photolive-auth-mode.hidden {
  display: none !important;
}

.photolive-auth-mode form {
  width: 100%;
}

.photolive-auth-mode label {
  display: block;

  margin-bottom: 15px;

  color: #172033;
  font-weight: 600;
}

/* CAMPOS */
.photolive-auth-mode input {
  width: 100%;
  min-height: 50px;

  margin-top: 7px;
  padding: 12px 14px;

  box-sizing: border-box;

  border-radius: 10px;
  border: 1px solid #cfd9e2;

  background: #ffffff;
  color: #172033;

  font: inherit;
}

.photolive-auth-mode input::placeholder {
  color: #7a8794;
}

/* BOTÃO ENTRAR */
.photolive-auth-primary {
  width: 100%;
  min-height: 50px;

  border: 0;
  border-radius: 11px;

  background: #087f8c;
  color: #ffffff;

  font: inherit;
  font-weight: 800;

  cursor: pointer;
}

/* GOOGLE */
.photolive-google-btn {
  width: 100%;
  min-height: 50px;

  margin-top: 10px;

  border: 1px solid #d2dbe3;
  border-radius: 11px;

  background: #ffffff;
  color: #172033;

  font: inherit;
  font-weight: 700;

  cursor: pointer;
}

/* LINKS */
.photolive-link-btn {
  width: 100%;
  min-height: 42px;

  margin-top: 8px;

  border: 0;
  border-radius: 10px;

  background: transparent;
  color: #087f8c;

  font: inherit;
  font-size: 14px;

  cursor: pointer;
}

.photolive-link-btn:hover {
  color: #065e68;
}

/* VOLTAR */
.photolive-access-back {
  display: block;

  margin-top: 22px;

  text-align: center;

  color: #087f8c;
  text-decoration: none;
}

.photolive-access-back:hover {
  color: #065e68;
}

/* TABLET */
@media (max-width: 768px) {
  .photolive-access-page {
    padding: 30px 18px;
  }

  .photolive-access-card {
    width: min(94vw, 520px);
    padding: 30px;
  }
}

/* CELULAR */
@media (max-width: 600px) {
  .photolive-access-page {
    padding: 18px 12px;
  }

  .photolive-access-card {
    width: 100%;
    max-width: 100%;

    padding: 24px 18px;

    border-radius: 20px;
  }

  .photolive-access-brand h1 {
    font-size: 27px;
  }

  .photolive-access-brand p {
    font-size: 15px;
  }
}

/* CELULAR PEQUENO */
@media (max-width: 380px) {
  .photolive-access-card {
    padding: 20px 14px;
  }

  .photolive-access-brand-icon {
    font-size: 34px;
  }

  .photolive-access-brand h1 {
    font-size: 24px;
  }
}

<body>

  <main class="photolive-access-page">

    <section class="photolive-access-card">

      <div class="photolive-access-brand">
        <span class="photolive-access-brand-icon">✨</span>

        <h1>PhotoLive Magic</h1>

        <p>
          Entre ou crie sua conta
        </p>
      </div>


      <div class="photolive-access-tabs">

        <button
          type="button"
          id="authTabLogin"
          class="photolive-access-tab active">
          Entrar
        </button>

        <button
          type="button"
          id="authTabRegister"
          class="photolive-access-tab">
          Criar conta
        </button>

      </div>


      <!-- LOGIN -->

      <section
        id="auth-login"
        class="photolive-auth-mode">

        <form id="loginForm">

          <label>
            E-mail

            <input
              id="loginEmail"
              type="email"
              autocomplete="email"
              required
              placeholder="seu@email.com">
          </label>


          <label>
            Senha

            <input
              id="loginPassword"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Sua senha">
          </label>


          <button
            id="loginSubmit"
            class="photolive-auth-primary"
            type="submit">
            🔐 Entrar
          </button>

        </form>


        <button
          id="googleLoginBtn"
          class="photolive-google-btn"
          type="button">
          🔵 Continuar com Google
        </button>


        <button
          id="showForgotBtn"
          class="photolive-link-btn"
          type="button">
          Esqueci minha senha
        </button>


        <button
          id="showRegisterBtn"
          class="photolive-link-btn"
          type="button">
          Ainda não tenho conta
        </button>

      </section>


      <!-- CADASTRO -->

      <section
        id="auth-register"
        class="photolive-auth-mode hidden">

        <form id="registerForm">

          <label>
            E-mail

            <input
              id="registerEmail"
              type="email"
              autocomplete="email"
              required
              placeholder="seu@email.com">
          </label>


          <label>
            Senha

            <input
              id="registerPassword"
              type="password"
              autocomplete="new-password"
              required
              placeholder="Mínimo de 6 caracteres">
          </label>


          <label>
            Confirmar senha

            <input
              id="registerPasswordConfirm"
              type="password"
              autocomplete="new-password"
              required
              placeholder="Repita sua senha">
          </label>


          <button
            id="registerSubmit"
            class="photolive-auth-primary"
            type="submit">
            ✨ Criar minha conta
          </button>

        </form>


        <button
          id="googleRegisterBtn"
          class="photolive-google-btn"
          type="button">
          🔵 Criar conta com Google
        </button>


        <button
          id="showLoginBtn"
          class="photolive-link-btn"
          type="button">
          Já tenho uma conta
        </button>

      </section>


      <a
        href="index.html"
        class="photolive-access-back">
        ← Voltar para a Home
      </a>

    </section>

  </main>


  <!-- MESMA AUTENTICAÇÃO DA V1 -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./acesso/auth-config.js"></script>

  <script src="./acesso/auth.js"></script>


  <script>
    const loginTab =
      document.getElementById("authTabLogin");

    const registerTab =
      document.getElementById("authTabRegister");

    const loginSection =
      document.getElementById("auth-login");

    const registerSection =
      document.getElementById("auth-register");

    function showAccessTab(type) {

      const login =
        type === "login";

      loginTab.classList.toggle(
        "active",
        login
      );

      registerTab.classList.toggle(
        "active",
        !login
      );

      loginSection.classList.toggle(
        "hidden",
        !login
      );

      registerSection.classList.toggle(
        "hidden",
        login
      );
    }


    loginTab?.addEventListener(
      "click",
      () => showAccessTab("login")
    );


    registerTab?.addEventListener(
      "click",
      () => showAccessTab("register")
    );


    document
      .getElementById("showRegisterBtn")
      ?.addEventListener(
        "click",
        () => showAccessTab("register")
      );


    document
      .getElementById("showLoginBtn")
      ?.addEventListener(
        "click",
        () => showAccessTab("login")
      );


    const params =
      new URLSearchParams(
        window.location.search
      );


    if (
      params.get("modo") === "cadastro"
    ) {
      showAccessTab("register");
    } else {
      showAccessTab("login");
    }
  </script>

</body>
